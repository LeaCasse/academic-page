---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="layout--{{ page.layout | default: 'default' }}{% if page.collection %} collection--{{ page.collection }}{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <button class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
      <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
    </button>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
  </body>
</html>
