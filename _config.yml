collections:
  publications:
    output: true
    permalink: /publication/:title/
  talks:
    output: true
    permalink: /talk/:title/
  portfolio:
    output: true
    permalink: /project/:title/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Keep repository tooling out of the generated public site.
exclude:
  - .devcontainer
  - .github
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - package.json
  - package-lock.json
  - README.md
  - scripts
  - vendor
